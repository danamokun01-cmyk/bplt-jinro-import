<style>
:root{--bg:#14111f;--c:#221d36;--t:#eee;--a:#e0556b;--m:#9a93b8}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:10px}
.card{background:var(--c);border-radius:10px;padding:10px 12px;margin:8px 0}

body{transition:background .8s,color .8s}
body.ph-night{--bg:#090b1c;--c:#161a35;--t:#e8eaff;--m:#8d93c8;background:radial-gradient(1.5px 1.5px at 20% 30%,#fff9,transparent),radial-gradient(1px 1px at 70% 20%,#fff9,transparent),radial-gradient(1.5px 1.5px at 40% 70%,#fff7,transparent),radial-gradient(1px 1px at 85% 60%,#fff8,transparent),radial-gradient(1px 1px at 10% 85%,#fff7,transparent),var(--bg);background-attachment:fixed}

.fac{border-left:4px solid;padding:2px 0 2px 8px;margin:8px 0}.fac>summary{padding:3px 0}
#cd.warn{animation:blk .8s infinite}
#fx{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .35s;z-index:50;background:radial-gradient(circle,#000a,#000e)}
#fx.on{opacity:1;pointer-events:auto}
.fxb{text-align:center;color:#fff;padding:20px;max-width:92%}
.fxi{font-size:76px;animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
.fxt{font-size:28px;font-weight:700;margin-top:8px;text-shadow:0 0 18px var(--fc);animation:rise .8s .1s both}

#fx.nightfx{background:linear-gradient(#050818f2,#0d1030f2)}
#fx.dayfx{background:linear-gradient(#ffd56bf0,#ff9f5af0)}#fx.dayfx .fxt,#fx.dayfx .fxs{color:#3a2200;text-shadow:none}

#fx2{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}

.cf{position:absolute;top:-40px;animation:fall linear forwards}

@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

.ri{padding:6px 0;border-bottom:1px solid #8882}.ri.me{background:#e0556b22;border-radius:6px;padding:6px}

/* ===== GAME THEME v2 ===== */
html{background:#0b0916;color-scheme:dark}
body,body[class]{background:none!important;--bg:#0f0b1d;--c:#1a1430d9;--t:#f1ecff;--m:#b3aad6;--a:#e0556b;--sil:#07050f;--win:#ffcf6b;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;text-shadow:0 1px 2px #0006}
body.ph-day{--c:#fff8e8e6;--t:#2b2418;--m:#7a6a4d;--a:#d9534f;--sil:#3b2a1c;--win:#fff;text-shadow:none}
body.ph-vote{--c:#2a1220e0;--t:#ffe9ee;--m:#d3a0ae;--sil:#12040a}
body::before{content:none!important}
#scene{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
#scene i,#scene svg{position:absolute;display:block;transition:opacity 1s,background 1s}
#scene .sky{inset:0;background:linear-gradient(#1b1240,#3a2150 60%,#7a3a5a)}
body.ph-night #scene .sky{background:linear-gradient(#04050f,#0b1030 55%,#1c2350)}
body.ph-day #scene .sky{background:linear-gradient(#6cc3f0,#bfe6ff 55%,#ffe7a8)}
body.ph-vote #scene .sky{background:linear-gradient(#1a0309,#5a0f22 60%,#a3202f)}
body.ph-end #scene .sky{background:linear-gradient(#150f34,#4a2a6a 60%,#e0a14a)}
#scene .stars{inset:0;opacity:.35;background:radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 33% 40%,#fff,transparent),radial-gradient(1.5px 1.5px at 58% 14%,#fff,transparent),radial-gradient(1px 1px at 76% 33%,#fff,transparent),radial-gradient(1.5px 1.5px at 90% 12%,#fff,transparent),radial-gradient(1px 1px at 22% 62%,#fff,transparent),radial-gradient(1px 1px at 68% 55%,#fff,transparent);animation:tw 4s ease-in-out infinite}
body.ph-night #scene .stars{opacity:1}body.ph-day #scene .stars{opacity:0}
#scene .moon{width:90px;height:90px;border-radius:50%;right:9%;top:7%;background:radial-gradient(circle at 35% 35%,#fffbe6,#e8e1b4 60%,#b9b27e);box-shadow:0 0 60px 18px #aab4ff66;opacity:0;animation:flt 8s ease-in-out infinite}
body.ph-night #scene .moon{opacity:1}
body.ph-vote #scene .moon{opacity:.9;background:radial-gradient(circle at 35% 35%,#ffb0b0,#e0556b 60%,#7a1020);box-shadow:0 0 70px 22px #ff3b5c66}
#scene .sun{width:120px;height:120px;border-radius:50%;left:10%;top:6%;opacity:0;background:radial-gradient(circle,#fff6c4 30%,#ffd55a 60%,transparent 72%);box-shadow:0 0 80px 30px #ffd55a88;animation:flt 7s ease-in-out infinite}
body.ph-day #scene .sun{opacity:1}
#scene .cloud{width:180px;height:50px;border-radius:50px;background:#fff;opacity:0;top:18%;left:-200px;filter:blur(2px);box-shadow:60px -20px 0 10px #fff,-40px 6px 0 -4px #fff;animation:drift 60s linear infinite}
#scene .c2{top:32%;animation-duration:90s;animation-delay:-30s;transform:scale(.7)}
body.ph-day #scene .cloud{opacity:.85}
#scene .fog{left:-20%;right:-20%;bottom:8%;height:30%;opacity:.25;background:radial-gradient(ellipse at 30% 60%,#cfd6ff,transparent 60%),radial-gradient(ellipse at 75% 40%,#cfd6ff,transparent 55%);animation:fogm 24s ease-in-out infinite alternate}
body.ph-day #scene .fog{opacity:.12}
#scene .vig{inset:0;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,#e0102a88)}
body.ph-vote #scene .vig{opacity:1;animation:pulse 2s ease-in-out infinite}
#scene .vil{left:0;bottom:0;width:100%;height:24vh;min-height:130px;fill:var(--sil)}
#scene .vil .wn{fill:var(--win);opacity:.9;animation:tw 5s ease-in-out infinite}
body.ph-day #scene .vil .wn{opacity:.15}
#scene .ff{width:5px;height:5px;border-radius:50%;background:#ffe27a;box-shadow:0 0 8px 3px #ffe27a99;left:var(--x);bottom:var(--y);animation:ffl var(--d) ease-in-out infinite;opacity:.8}
body.ph-day #scene .ff{opacity:0}
body[data-f="1"]:not(.ph-day) #scene .sky{filter:hue-rotate(-18deg) saturate(1.3)}
body[data-f="2"]:not(.ph-day) #scene .sky{filter:hue-rotate(35deg) saturate(1.2)}
body[data-f="3"]:not(.ph-day) #scene .sky{filter:hue-rotate(70deg) saturate(1.1)}
@keyframes tw{50%{opacity:.4}}@keyframes drift{to{transform:translateX(130vw)}}@keyframes fogm{to{transform:translateX(8%)}}
@keyframes pulse{50%{opacity:.45}}@keyframes ffl{0%,100%{transform:translate(0,0)}33%{transform:translate(18px,-26px)}66%{transform:translate(-14px,-12px)}}

/* portrait */
.pt{display:inline-block;line-height:0;flex:none}.pt svg{overflow:visible}.pt .au{transform-origin:60px 70px;animation:spn 16s linear infinite}
.pt .ey{transform-box:fill-box;transform-origin:center;animation:bl 4.5s infinite}.pt .ear{transform-box:fill-box;transform-origin:50% 100%;animation:tl 5s ease-in-out infinite}

#fx.rv{background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--fc) 35%,#000),#000f 75%)}

@keyframes flipin{from{transform:rotateY(90deg) scale(.3);opacity:0}to{transform:none;opacity:1}}
.ri .pt{float:left;margin:0 10px 4px 0}.ri{overflow:hidden}
